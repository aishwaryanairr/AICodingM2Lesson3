<!DOCTYPE html>
<html>
    <head>
        <title>My Superherocard</title>
        <style>
            /*Typogrphy-font,size ,weight,color fot the whole page*/
            body{
                background-color: darkblue;
                color:white;
                font-family:Arial,sans-serif;
            }
            /*Typography+Text Shadow -big bold title with orange shadoe*/
            .hero-name{
                font-size: 60px;
                font-weight:bold;
                color:yellow;
                text-shadow:3px 3px orange;
            }
            /*Typograpgy +Tex transformation-taglin becomes Tiltle Case*/
            .tagline{
                font-style:italic;
                color:lightblue;    text-transform:capitalize;

            }
            /*Text transform +Text decoration-section heading in CAPS with underline*/
            .label{
                text-transform:uppercase;
                text-decoration:underline;
                color:coral;
            }
            /*Typography-powers standout in bold green*/
            .power{
            font-widhth:bold;
            color:lightgreen;
            }
            /*Text Decoration-weakness are crossed out*/
            .weakness{
                text-decoration:line-through;
                color:grey;
            }
            /*Transformm0the badge is tilted to the side*/
            .badge{
                font-size:28px;
                font-weight:bold;
                color:gold;
                transform:rotate(15deg);
            } 
            /*Typography-footer text */
            .made-by{
                color:coral;
                font-style: italic;
            }
        </style>
    </head>
    <body>
        <h1 class="hero-name">Thunder Kid</h1>
        <p class="tagline">the most powerful hero </p>
        <h2 class="label">superpowers</h2>
            <p class="power">Can run faster than a cheethah</p>
        <h2 class="label">weaknesses</h2>
            <p class="weakness">Maths homework</p>
                        <p class="weakness">Broccoli</p>
            <p class="badge">Top hero</p>
            <p class="made-by">Made by: Aishwary</p>
    </body>
</html>
